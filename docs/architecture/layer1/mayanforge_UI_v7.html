function build(p){const tasks=taskRecords(p),done=p.build==='done',failed=p.build==='failed',complete=done?tasks.length:failed?Math.max(0,tasks.length-1):0;return `${header('Build')}${steps(p)}<div class="overviewhero"><div><div class="eyebrow">04 / IMPLEMENTATION</div><h2>Build activity & agent execution</h2><p class="muted">A high-level view of what agents are implementing. Select any activity to inspect its task, execution attempt and artifacts.</p></div><span class="badge ${done?'good':failed?'bad':'warn'}">${done?'Build completed':failed?'Attention required':'Awaiting execution'}</span></div><div class="metricrow"><div class="metric"><span>Tasks completed</span><strong>${complete} / ${tasks.length}</strong></div><div class="metric"><span>Agent runs</span><strong>${p.events.filter(e=>/build|worker|retry/i.test(e)).length}</strong></div><div class="metric"><span>Build state</span><strong>${done?'Completed':failed?'Failed':'Ready'}</strong></div><div class="metric"><span>Next gate</span><strong>Verification</strong></div></div><div class="workspace"><section class="panel"><div class="row between"><h2>Agent activity</h2><button class="btn" data-go="${projpath('Tasks')}">All tasks →</button></div><p class="muted small">Activities are connected to the task records for this project.</p><div class="activitylist">${tasks.map(t=>taskLink(p,t)).join('')}</div><div class="actions"><button class="btn primary" id="runbuild" ${!p.approved[2]||done?'disabled':''}>${failed?'Retry failed execution':'Run build simulation'}</button><button class="btn" id="failbuild" ${!p.approved[2]?'disabled':''}>Simulate worker failure</button></div>${!p.approved[2]?'<div class="notice">Approve Architecture before running Build.</div>':''}${failed?'<div class="notice"><strong>Execution interrupted.</strong> The failed attempt is preserved in activity history. Retry to recover or inspect the task first.</div>':''}</section><section class="panel"><h2>Request a change or enhancement</h2><p class="muted">Describe feedback on the current implementation. MayanForge records it as a proposed change for impact review; this demo does not automatically edit code.</p><label class="fieldlabel" for="buildfeedback">Implementation feedback</label><textarea class="textarea" id="buildfeedback" placeholder="Example: Add exponential backoff for payment gateway timeouts."></textarea><div class="actions"><button class="btn primary" id="submitfeedback">Submit change request</button></div><div class="info"><strong>Change requests (${(p.feedback||[]).length})</strong>${(p.feedback||[]).map((f,i)=>`<div class="listrow"><span>${esc(f)}</span><span class="badge">Impact review</span></div>`).join('')||'<p class="small">No feedback submitted yet.</p>'}</div><h3>Execution evidence</h3><div class="listrow">Latest implementation status <span class="badge">${esc(p.build)}</span></div><div class="listrow">Agent run details <button class="btn" data-go="${projpath('Execution Center')}">Execution Center →</button></div><div class="listrow">Generated outputs <button class="btn" data-go="${projpath('Artifacts')}">Artifacts →</button></div></section></div>`}
function verification(p){const passed=p.quality==='passed',failed=p.quality==='failed',pending=p.quality==='pending';const checks=[['Requirement coverage','REQ-01 / REQ-02','Trace approved acceptance criteria to test evidence'],['Idempotency behavior','REQ-01 · TASK-104','Concurrent duplicate event handling'],['Audit evidence','REQ-02 · TASK-105','Durable decision and processing records'],['Retry and recovery','REQ-03 · TASK-106','Transient failure recovery and replay']];return `${header('Verification')}${steps(p)}<div class="overviewhero"><div><div class="eyebrow">05 / INDEPENDENT QUALITY GATE</div><h2>Verification results & evidence</h2><p class="muted">QA Agents produce tests; the independent Evaluation Engine judges whether the resulting evidence meets the approved criteria.</p></div><span class="badge ${passed?'good':failed?'bad':'warn'}">${passed?'Passed':failed?'Failed':'Pending'}</span></div><div class="metricrow"><div class="metric"><span>Checks passed</span><strong>${passed?4:failed?3:0} / 4</strong></div><div class="metric"><span>Checks failed</span><strong>${failed?1:0}</strong></div><div class="metric"><span>Evidence state</span><strong>${pending?'Not evaluated':'Recorded'}</strong></div><div class="metric"><span>Release gate</span><strong>${passed?'Eligible':'Blocked'}</strong></div></div><div class="workspace"><section class="panel"><div class="row between"><h2>Evaluation checks</h2><span class="badge">Example evidence</span></div><p class="muted small">Open a check to see the requirement, related implementation task, and evaluation result.</p><div class="activitylist">${checks.map(([name,link,desc],i)=>`<button class="activity" data-check="${i}"><span class="agenticon">${pending?'○':failed&&i===1?'!':'✓'}</span><span class="activitybody"><strong>${esc(name)}</strong><small>${esc(link)} · ${esc(desc)}</small></span><span class="badge ${passed||failed&&i!==1?'good':failed?'bad':''}">${pending?'Not evaluated':failed&&i===1?'Failed':'Passed'}</span><span aria-hidden="true">→</span></button>`).join('')}</div><div class="actions"><button class="btn primary" id="runquality" ${p.build!=='done'?'disabled':''}>Run independent evaluation</button><button class="btn" id="failquality" ${p.build!=='done'?'disabled':''}>Simulate failed check</button></div>${p.build!=='done'?'<div class="notice">Build must complete before evaluation can run.</div>':''}</section><section class="panel"><h2>Quality gate decision</h2><div class="info"><strong>Separation of responsibilities</strong><p>QA Agent: creates and executes tests. Evaluation Engine: independently determines gate pass/fail using evidence.</p></div>${failed?`<div class="notice"><strong>Release blocked — idempotency check failed.</strong><p>Evidence points to the implementation task. Review the linked task and request remediation. Previous evaluation results remain in history.</p></div><button class="btn" data-task="TASK-104">Inspect affected task →</button><button class="btn primary" id="rework">Create remediation & return to Build →</button>`:passed?`<div class="info">All example checks passed. Release can now be reviewed.</div><button class="btn primary" data-go="${projpath('Release')}">Review release →</button>`:`<p class="muted">No evaluation decision has been recorded. Run the independent evaluation when Build is complete.</p>`}<h3>Evaluation history</h3>${p.events.filter(x=>/evaluation|rework/i.test(x)).slice().reverse().map(x=>`<div class="listrow">${esc(x)}</div>`).join('')||'<p class="muted small">No evaluation runs yet.</p>'}</section></div>`}
function taskDetail(p,id){const t=taskRecords(p).find(t=>t.id===id);if(!t)return `<div class="panel">Task not found. <button class="btn" data-go="${projpath('Tasks')}">Back to Tasks</button></div>`;return `${header('Tasks')}<button class="btn" data-go="${projpath('Build')}">← Back to Build</button><div class="overviewhero"><div><div class="eyebrow">${esc(t.id)} / ${esc(t.agent)}</div><h2>${esc(t.title)}</h2><p class="muted">Connected task, agent execution, logs and produced artifacts. Demonstration data only.</p></div><span class="badge">${esc(t.status)}</span></div><div class="workspace"><section class="panel"><h2>Execution attempts</h2><div class="listrow"><strong>${esc(t.run)}</strong><span class="badge ${p.build==='failed'?'bad':p.build==='done'?'good':''}">${p.build==='failed'?'Failed':p.build==='done'?'Completed':'Ready'}</span></div><h3>Execution log</h3><div class="code">[demo] task assigned to ${esc(t.agent)}\n[demo] approved architecture loaded\n[demo] isolated execution ${p.build==='failed'?'interrupted':p.build==='done'?'completed':'not started'}\n[demo] evidence attached to ${esc(t.id)}</div></section><section class="panel"><h2>Outputs and recovery</h2><div class="listrow">${esc(t.output)} <span class="badge">Illustrative artifact</span></div><button class="btn" data-go="${projpath('Artifacts')}">View artifacts →</button><button class="btn" data-go="${projpath('Execution Center')}">Inspect execution →</button>${p.build==='failed'?'<button class="btn primary" id="runbuild">Retry build →</button>':''}</section></div>`}
function evaluationDetail(p,index){const names=['Requirement coverage','Idempotency behavior','Audit evidence','Retry and recovery'];const i=Number(index),name=names[i]||names[0];return `${header('Verification')}<button class="btn" data-go="${projpath('Verification')}">← Back to Verification</button><div class="overviewhero"><div><div class="eyebrow">EVALUATION CHECK / ${i+1} OF 4</div><h2>${esc(name)}</h2><p class="muted">Evaluation evidence and traceability for this check.</p></div><span class="badge ${p.quality==='failed'&&i===1?'bad':p.quality==='passed'?'good':''}">${p.quality==='pending'?'Not evaluated':p.quality==='failed'&&i===1?'Failed':'Passed'}</span></div><div class="workspace"><section class="panel"><h2>Evaluation evidence</h2><p>${i===1?'Concurrent duplicate payment-event processing must not produce duplicate writes.':'Evidence must satisfy the linked approved requirement.'}</p><div class="info">This prototype uses simulated evaluation results. No real tests were executed.</div><h3>Traceability</h3><div class="listrow">Requirement <strong>REQ-0${i===3?3:i===2?2:1}</strong></div><div class="listrow">Implementation task <button class="btn" data-task="TASK-${104+Math.min(i,2)}">Open linked task →</button></div></section><section class="panel"><h2>Resolution</h2>${p.quality==='failed'&&i===1?'<p>Investigate the affected task and request remediation. Release remains blocked.</p><button class="btn primary" id="rework">Request rework →</button>':'<p>No remediation action required for this check in the current simulated state.</p>'}</section></div>`}
function release(p){const ready=p.quality==='passed'&&p.approved[2]&&p.build==='done';return `${header('Release')}${tabs('Release')}${steps(p)}<div class="workspace"><section class="panel"><h2>Release readiness</h2>${[['Architecture approved',p.approved[2]],['Build complete',p.build==='done'],['Independent evaluation passed',p.quality==='passed'],['Release approved',p.released]].map(([x,y])=>`<div class="listrow">${x}<span class="badge ${y?'good':'warn'}">${y?'Complete':'Pending'}</span></div>`).join('')}<div class="actions"><button class="btn primary" id="release" ${!ready||p.released?'disabled':''}>${p.released?'Release approved':'Approve simulated release'}</button></div></section><section class="panel"><h2>Human approval gate</h2><p>Release requires approved architecture, completed Build, and passing independent evaluation.</p><div class="notice">This action records a simulated approval. It does not deploy software or access any production environment.</div></section></div>`}
function projectList(){return `<div class="headrow"><h1>Projects</h1><button class="btn primary" data-go="app/New%20Project">+ New project</button></div><p class="muted">Choose a project to open its engineering workspace.</p><div class="cards">${state.projects.map(p=>`<article class="card"><span class="badge">${esc(stages[p.stage])}</span><h3>${esc(p.name)}</h3><p>${esc(p.brief)}</p><button class="btn primary" data-go="app/projects/${esc(p.id)}/Overview">Open project →</button></article>`).join('')}</div>`}
function newProject(){return `<h1>Create a project</h1><p class="muted">Start with a problem statement. You can refine the requirements during Intake.</p><div class="panel" style="max-width:700px"><label for="newname">Project name</label><input id="newname" class="composer" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:9px 0 18px" placeholder="e.g. Order Fulfillment Service"><label for="newbrief">What should MayanForge build?</label><textarea id="newbrief" class="textarea" placeholder="Describe the users, goals, and desired behavior."></textarea><div class="actions"><button class="btn primary" id="createproject">Create project →</button></div></div>`}
function other(page,p){if(typeof mf28ToolPages!=='undefined'&&mf28ToolPages.includes(page))return mf28Tools(page,p);if(page==='Dashboard')return `<div class="crumb">Workspace / Dashboard</div><h1>Workspace Dashboard</h1><p class="muted">Your projects and the work that needs attention.</p><div class="statgrid"><div class="stat"><strong>${state.projects.length}</strong><span>Projects</span></div><div class="stat"><strong>${state.projects.filter(x=>x.quality==='failed').length}</strong><span>Quality failures</span></div><div class="stat"><strong>${state.projects.filter(x=>x.released).length}</strong><span>Approved releases</span></div></div>${projectList()}`;if(page==='Projects')return `<div class="crumb">Workspace / Projects</div>${projectList()}`;if(page==='New Project')return `<div class="crumb">Workspace / New Project</div>${newProject()}`;if(page==='Opportunities')return `<div class="crumb">Workspace / Opportunities</div><h1>Opportunities</h1><div class="panel"><h2>Ideas worth exploring</h2><p>Use this workspace to capture potential software projects. Create a project when you are ready to begin Intake.</p><button class="btn primary" data-go="app/New%20Project">Create a project</button></div>`;if(page==='Settings')return `<div class="crumb">Workspace / Settings</div><h1>Settings</h1><div class="panel"><h2>Local prototype controls</h2><p>Project data is saved in browser localStorage, not a remote service.</p><button class="btn" id="reset">Reset demo data</button></div>`;if(page==='Help')return `<div class="crumb">Workspace / Help</div><h1>Help</h1><div class="panel"><h2>Start here</h2><p>Open a project, review Intake and Requirements, approve an Architecture decision, simulate Build, evaluate quality, and approve Release.</p><button class="btn" data-public="documentation">Read documentation</button></div>`;let content='';if(page==='Tasks')content='<p class="muted">Select a task to inspect its agent run, logs, outputs, and recovery options.</p>'+taskRecords(p).map(t=>taskLink(p,t)).join('');else if(page==='Artifacts')content=[['Project brief',p.brief],['Architecture decision',p.decision||'Pending'],['Build artifact',p.build],['Quality evidence',p.quality]].map(([a,b])=>`<div class="listrow"><strong>${esc(a)}</strong><span class="muted">${esc(b)}</span></div>`).join('');else if(page==='Approvals')content=`<div class="listrow">Architecture review <span class="badge ${p.approved[2]?'good':'warn'}">${p.approved[2]?'Approved':'Pending'}</span></div><div class="listrow">Release approval <span class="badge ${p.released?'good':'warn'}">${p.released?'Approved':'Pending'}</span></div><button class="btn" data-go="${projpath('Architecture')}">Open architecture decision →</button>`;else if(page==='Execution Center')content=`<p>Current execution: <strong>${esc(p.build)}</strong></p><p>Simulated workflow: validate architecture → schedule tasks → run agent → evaluate evidence.</p>${p.events.map(e=>`<div class="listrow">${esc(e)}</div>`).join('')}`;else if(page==='Agents & Skills')content=['Architecture Agent · system design','Backend Engineer Agent · Java and APIs','QA Agent · test generation','Evaluation Engine · independent component, not an agent'].map(x=>`<div class="listrow">${x}<span class="badge">Concept</span></div>`).join('');else if(page==='Integrations')content='<p>Git repositories, issue trackers, CI/CD systems, and cloud environments would connect here. No real integrations are enabled in this prototype.</p>';else if(page==='Monitoring')content=`<p>Release status: <strong>${p.released?'Simulated approval recorded':'Not released'}</strong></p><p>Operational telemetry requires a deployed system and real monitoring integration. Watchdog states (STALLED / ESCALATED) for running executions will appear here once Layer 3 is connected; an escalated run stays stopped until a person cancels it or authorizes recovery.</p>`;else if(page==='Costs & Usage')content='<p>Usage and billing data are not available in the static prototype. Real usage tracking requires authenticated metering and backend integration.</p>';return `${header(page)}${tabs(page)}<div class="panel"><h2>${esc(page)}</h2>${content||'<p>This page is not available in the current prototype.</p><button class="btn primary" data-go="app/Dashboard">Return to Dashboard</button>'}</div>`}
function renderApp(r){const page=activePage(r);if(state.lastRoute!==r){state.detail=null;state.lastRoute=r;}save();document.getElementById('public').classList.add('hidden');document.getElementById('application').classList.remove('hidden');document.getElementById('sidebar').innerHTML=sidebar(page);const p=project();const mf36BuildExpanded=page==='Build'&&document.querySelector('#main details.mf30-details')?.open;document.getElementById('main').innerHTML=state.detail?.type==='task'?taskDetail(p,state.detail.id):state.detail?.type==='check'?evaluationDetail(p,state.detail.id):page==='Overview'?overview(p):page==='Architecture'?architecture(p):page==='Requirements'?requirements(p):page==='Intake'?intake(p):page==='Build'?build(p):page==='Verification'?verification(p):page==='Release'?release(p):other(page,p);if(mf36BuildExpanded){const panel=document.querySelector('#main details.mf30-details');if(panel)panel.open=true}}function render(){const r=route();if(r.startsWith('app/'))renderApp(r);else renderPublic(r)}window.addEventListener('hashchange',render);
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.go){state.detail=null;goto(t.dataset.go);return}if(t.dataset.task){state.detail={type:'task',id:t.dataset.task};render();return}if(t.dataset.check){state.detail={type:'check',id:t.dataset.check};render();return}if(t.id==='submitfeedback'){const field=document.getElementById('buildfeedback'),value=field?.value.trim();if(!value||value.length<12){notify('Describe the requested change in at least 12 characters.');return}update(p=>{p.feedback=p.feedback||[];p.feedback.push(value);addEvent(p,'Build feedback submitted for impact review')});notify('Change request captured for impact review');return}if(t.dataset.public){goto(t.dataset.public);return}if(t.id==='launch'){goto('app/Dashboard');return}if(t.id==='advancedtoggle'){state.advanced=!state.advanced;save();render();return}if(t.id==='closemenu'){document.getElementById('sidebar').classList.remove('open');return}if(t.dataset.node){state.selectedNode=t.dataset.node;save();render();return}if(t.dataset.decision){update(p=>{p.decision=t.dataset.decision});return}if(t.id==='compare'){state.comparison=!state.comparison;save();render();return}if(t.dataset.approve!==undefined){const i=Number(t.dataset.approve);update(p=>{if(i>0&&!p.approved[i-1])return notify('Approve the previous stage first.');p.approved[i]=true;p.stage=Math.max(p.stage,i+1);addEvent(p,stages[i]+' approved')});notify('Stage approval recorded');return}if(t.id==='approvearch'){update(p=>{if(!p.approved[1])return notify('Approve Requirements first.');if(!p.decision)return;p.approved[2]=true;p.stage=3;addEvent(p,'Architecture decision approved: '+p.decision)});notify('Architecture decision approved');return}if(t.id==='savebrief'){update(p=>{p.brief=document.getElementById('brief').value.trim()||p.brief;addEvent(p,'Project brief updated')});notify('Brief saved');return}if(t.id==='sendask'){const q=document.getElementById('ask').value.trim();if(q)update(p=>{p.messages.push(q);addEvent(p,'Design question captured')});notify('Question saved locally; AI chat is not connected.');return}if(t.id==='runbuild'){update(p=>{if(!p.approved[2])return;p.build='done';p.quality='pending';p.released=false;p.stage=4;addEvent(p,'Build simulation completed')});notify('Simulated build completed');return}if(t.id==='failbuild'){update(p=>{p.build='failed';p.quality='pending';p.released=false;addEvent(p,'Simulated worker failure')});notify('Build failed. Recovery available.');return}if(t.id==='runquality'){update(p=>{if(p.build!=='done')return;p.quality='passed';p.approved[3]=true;p.approved[4]=true;p.stage=5;addEvent(p,'Independent evaluation passed')});notify('Evaluation passed');return}if(t.id==='failquality'){update(p=>{p.quality='failed';p.approved[4]=false;p.released=false;addEvent(p,'Independent evaluation failed')});notify('Quality gate blocked');return}if(t.id==='rework'){update(p=>{p.build='idle';p.quality='pending';p.approved[3]=false;p.approved[4]=false;p.released=false;p.stage=3;addEvent(p,'Rework requested')});notify('Rework requested; return to Build');return}if(t.id==='release'){update(p=>{if(p.quality!=='passed'||!p.approved[2]||p.build!=='done')return;p.released=true;p.approved[5]=true;p.stage=5;addEvent(p,'Simulated release approved')});notify('Release approval recorded (no deployment)');return}if(t.id==='createproject'){const name=document.getElementById('newname').value.trim(),brief=document.getElementById('newbrief').value.trim();if(name.length<3||brief.length<15){notify('Enter a project name and a description of at least 15 characters.');return}const id='project-'+Date.now();state.projects.push({id,name,brief,stage:0,approved:[false,false,false,false,false,false],decision:null,build:'idle',quality:'pending',released:false,requirements:[['REQ-01','Define measurable acceptance criteria','Draft']],tasks:[['Review project scope','Planned']],events:['Project created'],messages:[]});state.active=id;save();goto('app/projects/'+id+'/Overview');notify('Project created');return}if(t.id==='reset'){if(confirm('Reset all locally saved prototype projects?')){localStorage.removeItem('mf-v5');location.reload()}return}});document.addEventListener('change',e=>{if(e.target.id==='projectselect'){state.active=e.target.value;save();goto(projpath('Overview'))}});render();

const v8Save=()=>save();
function v8Init(p){
 if(p.v8)return p.v8;
 const payment=p.id==='payment-processing',risk=p.id==='risk-engine';
 const reqs=payment?[
 {id:'REQ-001',title:'Process payment events safely',kind:'Functional',description:'Accept and process payment events without duplicate charges.',stories:[{id:'US-001',title:'Evaluate incoming payment events',persona:'Payment operations',criteria:[{id:'AC-001',text:'A valid event is processed exactly once for each idempotency key.'},{id:'AC-002',text:'Concurrent duplicate events cannot create duplicate payment records.'}]},{id:'US-002',title:'Recover transient processing failures',persona:'Platform operator',criteria:[{id:'AC-003',text:'Transient failures are retried safely without duplicate side effects.'}]}]},
 {id:'REQ-002',title:'Provide auditable processing history',kind:'Functional',description:'Store evidence for each processing decision.',stories:[{id:'US-003',title:'Inspect transaction decisions',persona:'Risk analyst',criteria:[{id:'AC-004',text:'Every payment decision includes a timestamp and correlation identifier.'}]}]},
 {id:'NFR-001',title:'Reliability and security',kind:'Nonfunctional',description:'Enforce authenticated access, recoverable processing and documented latency targets.',stories:[]}
 ]:risk?[
 {id:'REQ-001',title:'Evaluate commerce events',kind:'Functional',description:'Score incoming events and record an explainable risk decision.',stories:[{id:'US-001',title:'Evaluate event risk',persona:'Risk analyst',criteria:[{id:'AC-001',text:'Each valid event receives a traceable risk decision.'},{id:'AC-002',text:'Duplicate events do not create duplicate enforcement actions.'}]}]},
 {id:'REQ-002',title:'Explain enforcement outcomes',kind:'Functional',description:'Store policy version and evidence for enforcement decisions.',stories:[{id:'US-002',title:'Review a flagged event',persona:'Risk analyst',criteria:[{id:'AC-003',text:'Analysts can inspect the decision reason and policy version.'}]}]},
 {id:'NFR-001',title:'Operational safeguards',kind:'Nonfunctional',description:'Secure data handling, observability, and recovery.',stories:[]}
 ]:[{id:'REQ-001',title:'Deliver the project outcome',kind:'Functional',description:p.brief,stories:[{id:'US-001',title:'Complete the primary user journey',persona:'End user',criteria:[{id:'AC-001',text:'The primary user journey succeeds under expected conditions.'}]}]},{id:'NFR-001',title:'Operational requirements',kind:'Nonfunctional',description:'Define availability, security, and performance targets.',stories:[]}];
 p.v8={requirements:reqs,reqVersion:1,reqApproved:!!p.approved[1],reqReviewNote:'',archVersion:1,archApproved:!!p.approved[2],adrs:[{id:'ADR-001',title:payment?'Durable idempotency strategy':risk?'Versioned decision evidence':'Reliable persistence and integration',choice:p.decision||'',reason:'Prefer durable correctness and traceable decisions.',reqIds:['REQ-001']}],components:[{id:'CMP-001',name:'API Gateway',desc:'Authentication and request validation'},{id:'CMP-002',name:payment?'Payment Service':risk?'Risk Decision Service':'Domain Service',desc:'Core domain behavior'},{id:'CMP-003',name:'Event Transport',desc:'Asynchronous delivery and retries'},{id:'CMP-004',name:'Database',desc:'Durable state and audit evidence'}],tasks:[],runs:[],evaluations:[],changes:[],selectedReq:'REQ-001',reqTab:'stories',buildPlan:false,selectedTask:null,selectedEval:null,qualityStatus:p.quality||'pending',buildStatus:p.build||'idle',releaseApproved:!!p.released,seq:0};
 if(p.v8.archApproved)v8Generate(p);
 return p.v8;
}

function v8Generate(p){const v=p.v8;const ac=v8AllAC(v);const specs=[['Implement event ingestion','Backend Engineer',0],['Implement durable idempotency','Backend Engineer',1],['Persist audit and decision evidence','Database Engineer',2],['Create integration and regression tests','QA Agent',3],['Configure monitoring and recovery','SRE Agent',4]];v.tasks=specs.map(([title,agent],i)=>({id:'TASK-'+(101+i),title,agent,status:'Planned',reqIds:i===2?['REQ-002']:['REQ-001'],acIds:i===1?ac.filter(x=>/duplicate|exactly once/i.test(x.text)).map(x=>x.id):i===2?ac.filter(x=>x.reqId==='REQ-002').map(x=>x.id):ac.slice(0,1).map(x=>x.id),dependsOn:i===0?[]:i===3?['TASK-101','TASK-102','TASK-103']:['TASK-101'],runIds:[],artifacts:[],notes:[]}));v.buildPlan=true;}

itecture mapping','goarch')}</div><div id="v8add" class="v8-detail hidden"><div class="v8-form"><label>Requirement or story title<input id="v8title" placeholder="Describe the needed behavior"></label><label>Type<select id="v8type"><option value="requirement">Requirement</option><option value="story">User story under REQ-001</option><option value="nonfunctional">Nonfunctional requirement</option></select></label><label>Details / acceptance criterion<textarea id="v8description" placeholder="Testable behavior, rule, or constraint"></textarea></label>${v8Btn('Save draft','addreq','', 'primary')}</div></div></section><section class="panel"><h2>Requirements readiness</h2><div class="listrow">Version <strong>v${v.reqVersion}</strong></div><div class="listrow">Approval <span class="badge ${v.reqApproved?'good':'warn'}">${v.reqApproved?'Approved':'Pending'}</span></div><div class="listrow">Stories <strong>${v.requirements.reduce((n,r)=>n+r.stories.length,0)}</strong></div><div class="listrow">Acceptance criteria <strong>${v8AllAC(v).length}</strong></div><div class="info"><strong>Next action</strong><p>${v.reqApproved?'Review architecture and system design against the approved baseline.':'Confirm requirements, edge cases and acceptance criteria, then approve the baseline.'}</p>${v8Btn(v.reqApproved?'Open Architecture':'Review & Approve',v.reqApproved?'goarch':'reqtab',v.reqApproved?'':'review','primary')}</div><h3>Traceability</h3><p class="muted small">Acceptance criteria will link to design decisions, engineering tasks, agent runs, and evaluation evidence.</p></section></div>`}
function v9Init(v,p){
 if(!v.archProposals){

   {id:'modular',title:'Modular Monolith',summary:'A single deployable application with strongly separated business modules.',components:['API Gateway','Spring Boot modules','PostgreSQL'],stack:'Java 21 · Spring Boot · PostgreSQL',cost:'Low initial infrastructure',scale:'Scale the application as a unit',reliability:'Straightforward transactional consistency',security:'One main application boundary; enforce module-level controls',operations:'Low operational complexity',strength:'Fast delivery, simpler debugging and transaction handling',risk:'Less independent scaling; modular boundaries must be maintained',assumptions:'Suitable when throughput and team size do not justify distributed services',score:payment?83:risk?79:86},
   {id:'events',title:'Event-Driven Services',summary:'Separate API and processing services with durable messaging and transactional storage.',components:['API Gateway','Payment / Risk API','Event Broker','Processing Workers','PostgreSQL'],stack:'Java 21 · Spring Boot · Kafka · PostgreSQL',cost:'Higher baseline infrastructure',scale:'Independent consumers and service scaling',reliability:'Requires idempotency, retries, ordering and DLQ controls',security:'Multiple service identities and trust boundaries',operations:'Higher operational and observability burden',strength:'Decoupled processing, resilience and independent scaling',risk:'Eventual consistency, distributed failures and higher operational cost',assumptions:'Best when async workloads, throughput, and independent scaling justify complexity',score:payment?90:risk?92:70},
   {id:'serverless',title:'Serverless & Managed Services',summary:'Managed API, functions, queues, and durable storage for usage-driven scaling.',components:['Managed API','Functions','Managed Queue','Managed Database'],stack:'Managed API · Functions · Queue · Database',cost:'Usage-dependent; watch high-volume costs',scale:'Elastic within provider quotas',reliability:'At-least-once delivery needs durable deduplication',security:'IAM policies across managed resources',operations:'Lower server administration; higher platform dependence',strength:'Rapid deployment, elastic capacity, minimal server management',risk:'Vendor lock-in, service limits and cold-start considerations',assumptions:'Suitable for variable demand and teams favoring managed operations',score:payment?76:risk?74:82}
  ];
  v.recommendedProposal=payment||risk?'events':'modular';
  v.selectedProposal=v.archApproved?(p.decision==='database'?'modular':v.recommendedProposal):v.recommendedProposal;
  v.proposalNotes=[];v.proposalRevision=1;
 }
 if(!v.selectedProposal||!v.archProposals.some(x=>x.id===v.selectedProposal))v.selectedProposal=v.recommendedProposal;

<script>

const mf27Areas=[['coverage','Requirements Coverage','Trace every requirement to tests and evidence'],['functional','Functional Testing','API, UI and end-to-end scenarios'],['ai','AI Quality Evaluation','RAG and classification scorecards'],['security','Security & Reliability','CRM approval, authorization and failure safety'],['defects','Defects & Retesting','Repair loop, reproduction and regression'],['gate','Quality Gates & Sign-off','Evidence-based release candidate verdict']];
const mf27Cases=[
['TC-001','PDF and DOCX ingestion','REQ-001','Functional','Upload valid files, scanned-only PDF, malformed DOCX and 11th document','Accepted files indexed with source metadata; unsupported inputs rejected'],
['TC-002','Chunk and embedding persistence','REQ-002','Functional','Ingest versioned document, query pgvector, inspect chunk IDs','Stable chunk metadata and correct vector model/index'],
['TC-003','Grounded document answers','REQ-003','AI','Ask answerable questions with known source passages','Every factual answer supported by retrieved evidence'],

['TC-018','Failure and audit recovery','NFR-002','Reliability','Inject dependency timeouts, duplicates and crashes','Errors, journal and reconciliation preserve safe outcomes'],
['TC-019','Performance and evaluation','NFR-003','Reliability','Measure latency and evaluation on approved fixtures','Metrics captured; acceptance thresholds explicitly approved'],

const mf27Safety=[['SEC-01','Unapproved CRM write','Reject without any CRM side effect','REQ-011'],['SEC-02','Payload changed after approval','Reject mismatched hash; audit attempt','REQ-011'],['SEC-03','Repeated approved write','No duplicate CRM effect','REQ-012'],['SEC-04','CRM timeout after dispatch','Record unknown result; reconcile or halt retries','REQ-012'],['SEC-05','n8n bypass attempt','Backend rejects unauthorized write','REQ-013'],['SEC-06','Invalid reviewer identity','Reject and audit unauthorized approval','NFR-001'],['SEC-07','Secrets in logs','Sensitive values must be redacted','NFR-001'],['SEC-08','Database outage','Preserve safe failure and observable audit state','NFR-002']];
function mf27State(v){if(!v.mf27)v.mf27={area:'coverage',req:'REQ-001',test:'TC-001',ai:'rag',security:'SEC-01',defect:'DEF-EXAMPLE',gateTab:'readiness'};return v.mf27}
function mf27Status(){return '<span class="badge warn">Not run</span>'}
function mf27Coverage(v,s){const r=v.requirements.find(x=>x.id===s.req)||v.requirements[0],related=mf27Cases.filter(x=>x[2]===r.id);return `<div class="mf27-layout"><section class="panel"><h2>Requirements matrix</h2><p class="mf20-muted">${v.requirements.length} functional and nonfunctional requirements · 0 independently executed.</p>${v.requirements.map(x=>`<button class="mf27-select ${r.id===x.id?'active':''}" data-mf27="req" data-id="${esc(x.id)}"><strong>${esc(x.id)} · ${esc(x.title)}</strong><small>${esc(x.kind)} · Not verified</small></button>`).join('')}</section><section class="panel"><div class="eyebrow">REQUIREMENT INSPECTOR</div><h2>${esc(r.id)} · ${esc(r.title)}</h2><p>${esc(r.description)}</p><h3>Acceptance criteria</h3>${(r.stories||[]).flatMap(st=>st.criteria||[]).map(a=>`<div class="mf27-card"><strong>${esc(a.id)}</strong><p>${esc(a.text)}</p></div>`).join('')||'<div class="mf27-note">Cross-cutting nonfunctional requirement; finalize measurable acceptance criteria before verification.</div>'}<h3>Verification cases</h3>${related.map(t=>`<button class="mf27-select" data-mf27="open-test" data-id="${t[0]}"><strong>${t[0]} · ${esc(t[1])}</strong><small>${esc(t[3])} · Not run</small></button>`).join('')||'<div class="mf27-note">No mapped test yet. Coverage is incomplete.</div>'}<h3>Evidence</h3><div class="mf27-note">No independent test run, assertion logs, or build-bound evidence. Requirement cannot pass.</div></section></div>`}
function mf27Functional(s){const selected=mf27Cases.find(x=>x[0]===s.test)||mf27Cases[0];return `<div class="mf27-layout"><section class="panel"><h2>Test catalog</h2><p class="mf20-muted">Test definitions only. No test executions have occurred.</p>${mf27Cases.map(x=>`<button class="mf27-select ${selected[0]===x[0]?'active':''}" data-mf27="test" data-id="${x[0]}"><strong>${x[0]} · ${esc(x[1])}</strong><small>${x[2]} · ${x[3]} · Not run</small></button>`).join('')}</section><section class="panel"><div class="eyebrow">TEST CASE INSPECTOR</div><h2>${esc(selected[0])} · ${esc(selected[1])}</h2><p><span class="badge">${esc(selected[3])}</span> <span class="badge">${esc(selected[2])}</span> ${mf27Status()}</p><h3>Test procedure</h3><div class="mf27-card">${esc(selected[4])}</div><h3>Expected result</h3><div class="mf27-card">${esc(selected[5])}</div><h3>Execution requirements</h3>${['Pinned integrated build commit and environment manifest','Versioned fixture/test dataset and test command','Assertions, actual output, timestamps and logs','Independent reviewer/evaluator and evidence artifact hash'].map(x=>`<div class="mf20-step">${esc(x)}</div>`).join('')}<div class="mf27-note">This prototype defines the test. It does not run a test runner or manufacture a pass/fail result.</div></section></div>`}
function mf27AI(s){const rag=s.ai==='rag';const metrics=rag?[['Retrieval Recall@k','Find expected evidence in top-k passages'],['Answer faithfulness','Answer claims supported by evidence'],['Citation correctness','Cited chunks support claims'],['Abstention rate','Correctly decline unsupported questions']]:[['Macro-F1','Balance quality across categories'],['Per-class precision/recall','Find weak and confused categories'],['Confusion matrix','Inspect misclassification patterns'],['Human-review routing','Escalate ambiguous or invalid requests']];return `<section class="panel"><h2>AI Evaluation Scorecard</h2><p class="mf20-muted">Independent evaluation on versioned datasets. No model scores are invented.</p><div class="mf27-subtabs"><button class="${rag?'active':''}" data-mf27="ai" data-id="rag">RAG Engine</button><button class="${!rag?'active':''}" data-mf27="ai" data-id="classifier">Classification Engine</button></div><table class="mf27-table"><thead><tr><th>Metric</th><th>What it measures</th><th>Result</th><th>Threshold</th></tr></thead><tbody>${metrics.map(x=>`<tr><td><strong>${esc(x[0])}</strong></td><td>${esc(x[1])}</td><td>${mf27Status()}</td><td>To approve</td></tr>`).join('')}</tbody></table><h3>Evaluation procedure</h3><div class="mf27-steps">${['Load labeled, versioned fixtures','Pin model, prompt and retrieval settings','Execute benchmark on integrated build','Compute deterministic metrics','Sample judge decisions for human audit','Compare against approved thresholds'].map((x,i)=>`<div><strong>${i+1}. ${esc(x)}</strong><small>${i===0?'Customer data not yet supplied':i===5?'Gate remains blocked until criteria are agreed':'Evidence pending execution'}</small></div>`).join('')}</div><div class="mf27-note">${rag?'Required inputs: text-based customer documents, answerable and unanswerable questions, source evidence labels.':'Required inputs: agreed category taxonomy and customer-labeled request examples.'} Until these exist, report <strong>Blocked</strong>, not a fabricated quality score.</div></section>`}

function mf27Defects(){return `<section class="panel"><h2>Defect & retest workflow</h2><p class="mf20-muted">No observed MF-001 verification defects. The example below illustrates how a failure should be handled.</p><div class="mf27-card"><div class="mf26-inline"><strong>EXAMPLE-DEF-001 · CRM duplicate write on timeout</strong><span class="badge warn">Illustration only</span></div><p>Potential failure: a timed-out write is retried and creates a second CRM note.</p><p><strong>Related:</strong> REQ-012 · TC-012 · SEC-04 · CRM Adapter / Approval Engine</p></div><div class="mf27-steps">${[['1. Capture','Failing assertion, trace ID, inputs and reproducible fixture'],['2. Triage','Severity, requirement and component ownership'],['3. Repair','Create linked Engineering Task with scoped file permissions'],['4. Reintegrate','Merge reviewed patch into a new immutable candidate'],['5. Retest','Rerun failed case plus regression suite'],['6. Decide','Independent evaluator updates gate for new candidate']].map(x=>`<div><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div><h3>Defect registry</h3><table class="mf27-table"><tr><th>Recorded defects</th><th>Open critical</th><th>Retest evidence</th></tr><tr><td>0 observed</td><td>Unknown — not tested</td><td>None</td></tr></table><div class="mf27-note">The Orchestrator schedules remediation; Build Agents fix defects; the independent evaluator verifies the repaired candidate. A repair never changes the previous candidate's evidence.</div></section>`}
function mf27Gate(v,s){const blockers=[['Approved requirements and acceptance thresholds',!!v.reqApproved],['Approved architecture and system design',!!v.archApproved],['Integrated candidate with commit and artifact hashes',false],['Actual functional and AI evaluation evidence',false],['CRM safety and reliability evidence',false],['Customer evaluation fixtures and categories',false],['Independent evaluation verdict for candidate',false]];return `<section class="panel"><div class="mf26-inline"><div><h2>Final Quality Gate</h2><p class="mf20-muted">Decision is bound to an immutable candidate, not an agent's completion status.</p></div><span class="badge warn">Blocked</span></div><div class="mf27-subtabs"><button class="${s.gateTab==='readiness'?'active':''}" data-mf27="gate-tab" data-id="readiness">Readiness checklist</button><button class="${s.gateTab==='report'?'active':''}" data-mf27="gate-tab" data-id="report">Verification report</button></div>${s.gateTab==='report'?`<table class="mf27-table">${[['Candidate commit','Not available'],['Requirement coverage','20 requirements defined; no independent runs'],['Functional test evidence','Not available'],['RAG / classifier metrics','Not measured'],['Security / CRM safety','Not tested'],['Defects / exceptions','No observed results; cannot conclude none exist'],['Evaluator decision','Blocked'],['Human sign-off','Not requested']].map(x=>`<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('')}</table>`:`${blockers.map(([label,ready])=>`<div class="mf20-step mf26-inline"><strong>${esc(label)}</strong><span class="badge ${ready?'good':'warn'}">${ready?'Recorded':'Missing / pending'}</span></div>`).join('')}`}<h3>Possible verdicts</h3><div class="mf27-badges"><span class="badge good">Passed</span><span class="badge bad">Failed</span><span class="badge warn">Blocked</span><span class="badge">Review required</span></div><div class="mf27-note"><strong>Current verdict: Blocked.</strong> The prototype has no integrated executable artifact or independent CI/evaluation results. Sample agent runs and simulated task completion do not count as verification evidence. Release approval must remain unavailable.</div></section>`}
verification=function(p){if(!p||p.id!=='mf-001')return mf27PreviousVerification(p);const v=v8Init(p),s=mf27State(v);const title=mf27Areas.find(x=>x[0]===s.area)||mf27Areas[0];const content=s.area==='coverage'?mf27Coverage(v,s):s.area==='functional'?mf27Functional(s):s.area==='ai'?mf27AI(s):s.area==='security'?mf27Security(s):s.area==='defects'?mf27Defects():mf27Gate(v,s);return `${v8Stage(p,'Verification')}<div class="overviewhero"><div><div class="eyebrow">05 / INDEPENDENT QUALITY GATE</div><h2>Verification Center</h2><p class="muted">MF-001 · Validate requirements, AI quality, CRM safety and release readiness with independent evidence.</p></div><span class="badge warn">Not started</span></div><div class="mf27-metrics"><div class="panel"><strong>${v.requirements.length}</strong><small>Requirements to verify</small></div><div class="panel"><strong>${mf27Cases.length}</strong><small>Defined test cases</small></div><div class="panel"><strong>0</strong><small>Actual test executions</small></div><div class="panel"><strong>Blocked</strong><small>Quality gate</small></div></div><div class="mf27-note"><strong>Verification is not simulated as passing.</strong> MF-001 needs a reproducible integrated build, customer evaluation inputs and real test evidence. The catalog below is an inspectable verification specification.</div><div class="mf27-layout"><section class="panel"><h2>Verification Explorer</h2><p class="mf20-muted">Select an area to inspect its criteria, scenarios and evidence requirements.</p><div class="mf27-nav">${mf27Areas.map(x=>`<button class="${s.area===x[0]?'active':''}" data-mf27="area" data-id="${x[0]}"><strong>${x[1]}</strong><small>${x[2]}</small></button>`).join('')}</div></section><section class="panel"><div class="eyebrow">VERIFICATION AREA</div><h2>${title[1]}</h2><p class="mf20-muted">${title[2]}</p><div class="mf27-note">Select details below. Test definitions are proposals until baselined; observed results require a real runner.</div></section></div><div style="margin-top:16px">${content}</div>`};
document.addEventListener('click',function(e){const b=e.target.closest('[data-mf27]');if(!b)return;const p=project();if(!p||p.id!=='mf-001')return;e.preventDefault();e.stopImmediatePropagation();const s=mf27State(v8Init(p)),a=b.dataset.mf27,id=b.dataset.id;if(a==='area')s.area=id;else if(a==='req')s.req=id;else if(a==='test')s.test=id;else if(a==='open-test'){s.area='functional';s.test=id}else if(a==='ai')s.ai=id;else if(a==='security')s.security=id;else if(a==='gate-tab')s.gateTab=id;v8Save();render()},true);

<script>

{id:'plan',title:'1. Plan verification',owner:'Verification Planning Agent',simple:'Turn approved requirements into a coverage plan.',inputs:['Approved requirements and acceptance criteria','Architecture baseline and risk policies'],actions:['Map each requirement to verifiable scenarios','Identify gaps, mandatory gates and missing customer inputs','Propose a versioned verification plan for review'],outputs:['Coverage matrix','Verification plan and risk priorities'],gate:'Missing acceptance criteria or unapproved thresholds block affected cases.',area:'coverage'},

{id:'judge',title:'5. Decide quality gates',owner:'Independent Evaluation Engine',simple:'Apply approved rules to evidence, not agent claims.',inputs:['Executed test evidence and AI metrics','Versioned quality policies and required coverage'],actions:['Validate candidate/evidence identity and completeness','Apply deterministic safety and quality gates','Return Passed, Failed, Blocked or Review required'],outputs:['Versioned evaluation verdict','Gate-by-gate reasons and defect candidates'],gate:'Coding agents cannot approve their own work; missing evidence never counts as passing.',area:'gate'},

ferences before scheduling eligible downstream work.'}</div><div class="mf29-footer"><button type="button" class="btn primary" data-mf29="open-area" data-id="${selected.area}">Explore related verification details →</button><button type="button" class="btn" data-mf29="next">Next activity →</button></div></div><div class="mf27-note" style="margin-top:12px"><strong>Important:</strong> These are internal capabilities, not six new navigation stages. QA agents design tests; test runners execute them; the independent Evaluation Engine decides quality gates. Any failure returns through the existing Orchestrator to Build → Integration → Verification. No real execution is implied by this diagram.</div></section>`}

verification=function(p){const original=mf29PreviousVerification(p);if(!p||p.id!=='mf-001')return original;const anchor='<div class="mf27-layout">';const idx=original.indexOf(anchor);if(idx<0)return original+mf29Workflow();return original.slice(0,idx)+mf29Workflow()+original.slice(idx)};

<script>

function mf30ProjectHero(p){return `<section class="panel mf30-summary"><div class="eyebrow">PROJECT AT A GLANCE · PROTOTYPE</div><h2 style="margin:8px 0">${esc(p.name)}</h2><p class="muted">${esc(p.brief)}</p><div class="mf30-cards"><div class="mf30-card"><strong>Current stage</strong><small>${esc(stages[p.stage]||'Intake')}</small></div><div class="mf30-card"><strong>Build</strong><small>${esc(p.build==='done'?'Completed (demo state)':p.build==='failed'?'Needs attention':p.build==='idle'?'Not executed':'In progress / demo state')}</small></div><div class="mf30-card"><strong>Independent verification</strong><small>${esc(p.quality==='passed'?'Passed (demo state, not real evidence)':p.quality==='failed'?'Failed (demo state)':'Not independently executed')}</small></div></div></section>`}
function mf30Overview(p){const [action,link]=nextAction(p);const target=link.replace('Review ','').replace('Open ','').replace('View ','');return `${header('Overview')}${steps(p)}<div class="mf30-simple">${mf30ProjectHero(p)}<section class="panel"><div class="eyebrow">WHAT NEEDS ATTENTION</div><h2 style="margin:8px 0">${esc(action)}</h2><p class="muted">The next step depends on the current project state. Approval and execution in this prototype are illustrative.</p><div class="mf30-actions"><button class="btn primary" data-go="${projpath(target)}">${esc(link)} →</button><button class="btn" data-go="${projpath('Build')}">View Build</button><button class="btn" data-go="${projpath('Verification')}">View Verification</button></div></section><section class="panel"><h2>Delivery progress</h2>${stages.map((s,i)=>`<div class="mf30-line"><span>${i+1}. ${esc(s==='Architecture'?'Architecture & System Design':s)}</span><span class="mf30-status">${esc(mf30StageStatus(p,i))}</span></div>`).join('')}</section><details class="mf30-details"><summary>Advanced: project activity and technical context</summary><div class="panel"><h2>Recorded activity</h2>${p.events.slice(0,8).map(x=>`<div class="listrow">${esc(x)}</div>`).join('')||'<p class="muted">No activity recorded.</p>'}<p class="mf30-note">These are prototype events, not evidence of real worker execution.</p><button class="btn" data-go="${projpath('Artifacts')}">Inspect artifacts →</button></div></details></div>`}

uild?'Understand independent Verification →':'See development testing in Build →'}</button></div></section><details class="mf30-details"><summary>Explore detailed ${area.toLowerCase()} workspace (agents, tasks, tests and evidence)</summary>${old}</details></div>`}

<script>
const mf40PriorBuild=build;
const mf40Fly={};// taskId -> 'sandbox' | 'validation' while a simulated wave is in flight (not persisted)
const mf40Colors=['#2563eb','#0891b2','#7c3aed','#059669','#d97706','#4f46e5','#db2777','#64748b'];
function mf40S(v){const s=mf20State(v);if(!s.mf40)s.mf40={pkg:'all',sel:null,panel:null,tab:'summary',doneOpen:false,classic:false};if(!s.mf40.open)s.mf40.open={};return s.mf40}
function mf40Packages(p,v){const tasks=v.tasks||[];let pk;if(p.id==='mf-001'&&typeof mf25Packages!=='undefined'){pk=mf25Packages.map(k=>({id:k.id,name:k.name,role:k.role,objective:k.objective,steps:k.steps||[],modules:k.modules||[],contracts:k.contracts||[],tests:k.tests||[],risks:k.risks||[],done:k.done||'',ids:tasks.slice(k.range[0],k.range[1]).map(t=>t.id)}))}else{pk=mf20Milestones(v).map((m,i)=>({id:'WP-0'+(i+1),name:m.name.replace(/^\d+\s*·\s*/,''),role:m.roles,objective:m.detail,steps:[],modules:[],contracts:[],tests:[],risks:[],done:'',ids:m.ids}))}
 const seen=new Set(pk.flatMap(k=>k.ids));const rest=tasks.filter(t=>!seen.has(t.id)).map(t=>t.id);if(rest.length)pk.push({id:'WP-X',name:'Other',role:'',objective:'',steps:[],modules:[],contracts:[],tests:[],risks:[],done:'',ids:rest});
 pk=pk.filter(k=>k.ids.length);pk.forEach((k,i)=>k.color=mf40Colors[i%mf40Colors.length]);return pk}
function mf40PkgOf(pk,id){return pk.find(k=>k.ids.includes(id))||pk[0]||{id:'WP-X',name:'Other',color:'#64748b',ids:[],objective:'',steps:[],modules:[],contracts:[],tests:[],risks:[],done:''}}
function mf40Done(t){return t.status==='Completed'&&t.mf40Reviewed}
// Demo assumption: MF-001's architecture counts as approved for Build. The Architecture stage and its saved data are not changed.
function mf40ArchOk(v){if(v.archApproved)return true;const p=state.projects.find(x=>x.v8===v);return !!p&&p.id==='mf-001'}
function mf40CanRun(v){return mf40ArchOk(v)&&!!mf20State(v).planApproved}
// dependencies satisfied (built and reviewed); does not consider approvals
function mf40DepsOk(t,v){return !mf40Fly[t.id]&&t.status!=='Completed'&&(t.dependsOn||[]).every(d=>{const x=v.tasks.find(y=>y.id===d);return !x||mf40Done(x)})}
function mf40State(t,v){if(mf40Fly[t.id])return mf40Fly[t.id];if(t.status==='Failed')return 'failed';if(t.status==='Completed')return t.mf40Reviewed?'done':'review';if(!mf40DepsOk(t,v))return 'waiting';return mf40CanRun(v)?'ready':'first'}
function mf40Col(st){return st==='waiting'||st==='ready'||st==='first'?'backlog':st==='failed'?'sandbox':st}
const mf40Label={waiting:'Waiting',first:'First up',ready:'Ready',sandbox:'Running',validation:'Validating',failed:'Failed',review:'Needs review',done:'Done'};
function mf40StClass(st){return st==='sandbox'||st==='validation'?'running':st}
function mf40Blockers(t,v){return (t.dependsOn||[]).filter(d=>{const x=v.tasks.find(y=>y.id===d);return x&&!mf40Done(x)})}
function mf40Card(t,v,pk,sel,showPkg=true){const st=mf40State(t,v),k=mf40PkgOf(pk,t.id);const blockers=mf40Blockers(t,v);
 let rel='';if(sel){const s=v.tasks.find(x=>x.id===sel);if(t.id===sel)rel='sel';else if(s&&(s.dependsOn||[]).includes(t.id))rel='dep';else if((t.dependsOn||[]).includes(sel))rel='next'}
 const note=st==='waiting'?`Waits on ${blockers.length}`:mf40Label[st];
 return `<button type="button" class="mf40-card ${mf40StClass(st)} ${rel}" data-mf40="select" data-id="${esc(t.id)}" aria-pressed="${t.id===sel}">${showPkg?`<span class="mf40-pkg"><span class="mf40-sw" style="background:${k.color}"></span>${esc(k.name)}</span>`:''}<div class="t">${esc(t.title)}</div><div class="m"><span>${esc(t.id)}${t.runIds?.length>1?' · '+t.runIds.length+' attempts':''}</span><span class="mf40-st ${mf40StClass(st)}">${esc(note)}</span></div></button>`}
// open/closed state for package groups; defaults open the groups where work can start
function mf40IsOpen(b,key,def){return b.open[key]===undefined?def:b.open[key]}
function mf40GroupHead(key,k,open,right){return `<button type="button" class="mf40-group" data-mf40="pgroup" data-id="${esc(key)}" aria-expanded="${open}"><span class="g"><span class="mf40-chev ${open?'open':''}">▸</span><span class="mf40-sw" style="background:${k.color}"></span><span>${esc(k.name)}</span></span><small>${right}</small></button>`}
// Build steps: Plan → Approve → Run → Integrate. Each step is clickable and opens its own view.
function mf40Gates(v,s,b,view,intPassed){const tasks=v.tasks||[],total=tasks.length,arch=mf40ArchOk(v);const reviewed=tasks.filter(mf40Done).length;const int=s.mf40Int||{};
 const g=[['plan','Plan',arch&&total>0,total?(arch?`${total} tasks · v${s.planRevision}`:'draft'):'not generated'],['approve','Approve',arch&&!!s.planApproved,s.planApproved?'approved by a person':'needs a person'],['run','Run',total>0&&reviewed===total,total?`${reviewed} of ${total} reviewed`:''],['integrate','Integrate',intPassed,intPassed?'release candidate ready':int.status==='failed'?'pipeline failed':int.status==='running'?'pipeline running':total?`${reviewed} of ${total} PRs merged`:'']];
 const cur=arch?g.findIndex(x=>!x[2]):-1;
 return `<nav class="mf40-steps" aria-label="Build steps">${arch?'':'<span class="mf40-gate blocked" style="flex:none;margin:0 8px">Waiting on architecture</span>'}${g.map(([id,n,ok,meta],i)=>`${i?'<span class="mf40-step-line" aria-hidden="true"></span>':''}<button type="button" class="mf40-step ${ok?'done':''} ${i===cur?'current':''} ${view===id?'active':''}" data-mf40="view" data-id="${id}" aria-current="${view===id?'step':'false'}"><span class="num">${ok?'✓':i+1}</span><span class="lbl">${n}<small>${esc(meta)}</small></span></button>`).join('')}</nav>`}
function mf40Waves(tasks){const depth={};const d=t=>{if(depth[t.id]!==undefined)return depth[t.id];depth[t.id]=1;const ds=(t.dependsOn||[]).map(id=>tasks.find(x=>x.id===id)).filter(Boolean);return depth[t.id]=1+(ds.length?Math.max(...ds.map(d)):0)};return tasks.length?Math.max(...tasks.map(d)):0}
function mf40PlanView(p,v,s,b,pk){const tasks=v.tasks;const arch=mf40ArchOk(v);const proposal=v.archProposals?.find(x=>x.id===(v.approvedProposal||v.selectedProposal));
 const firstUp=tasks.filter(t=>!(t.dependsOn||[]).length).length;
 const actions=s.planApproved?`<span class="badge good">Approved</span><button class="btn" data-mf20="reopen">Revise plan</button>`:`<button class="btn primary" data-mf40="view" data-id="approve" ${arch?'':'disabled'}>Continue to approval →</button>`;
 const rows=pk.map((k,i)=>{const open=mf40IsOpen(b,'plan:'+k.id,i===0);const ts=k.ids.map(id=>tasks.find(t=>t.id===id)).filter(Boolean);const roles=k.role?esc(k.role)+' · ':'';
  return `<div class="mf40-prow">${mf40GroupHead('plan:'+k.id,{...k,name:k.id+' · '+k.name},open,`${roles}${ts.length} task${ts.length>1?'s':''}`)}${open?`<div class="mf40-pbody">${k.objective?`<p>${esc(k.objective)}</p>`:''}${ts.map(t=>{const deps=(t.dependsOn||[]);return `<button type="button" class="mf40-trow ${b.sel===t.id?'sel':''}" data-mf40="select" data-id="${esc(t.id)}"><code>${esc(t.id)}</code><span>${esc(t.title)}</span><small>${deps.length?'after '+esc(deps.slice(0,2).join(', '))+(deps.length>2?' +'+(deps.length-2):''):'can start first'}</small></button>`}).join('')}</div>`:''}</div>`}).join('');
 return `<section class="mf40-plan" aria-label="Implementation plan"><div class="mf40-planhead"><div><div class="mf40-eyebrow">Step 1 · Plan</div><h2>Implementation plan v${esc(s.planRevision)}</h2><p>${tasks.length} tasks in ${pk.length} work packages, generated by the planning agent from ${esc(proposal?.title||'the architecture')} v${esc(v.archVersion)}. ${firstUp} task${firstUp===1?'':'s'} can start first; the rest follow their dependencies. Open a package to see its tasks, or a task to see its full spec.${arch?'':' <b>The architecture must be approved before this plan can be.</b>'}</p></div><div class="mf40-actions" style="margin:0">${actions}</div></div>${rows}</section>`}
function mf40ApproveView(p,v,s,b,pk){const tasks=v.tasks,arch=mf40ArchOk(v);const roles=new Set(tasks.map(t=>t.agent)).size;const first=tasks.filter(t=>!(t.dependsOn||[]).length).length;const waves=mf40Waves(tasks);
 const reqIds=(v.requirements||[]).map(r=>r.id);const covered=reqIds.filter(id=>tasks.some(t=>(t.reqIds||[]).includes(id)));
 const checks=[['Every requirement is covered by at least one task',`${covered.length} of ${reqIds.length} requirements are linked to tasks`],['Task order and dependencies make sense',`${waves} waves of work; ${first} task${first===1?'':'s'} can start first`],['Agent roles and permissions are appropriate',`${roles} agent roles; each task runs in its own isolated sandbox`],['Risks and safety requirements are acknowledged','Listed per work package in the plan (Spec tab of each task)']];
 const tiles=`<div class="mf40-tiles"><div><b>${tasks.length}</b><span>tasks</span></div><div><b>${pk.length}</b><span>work packages</span></div><div><b>${roles}</b><span>agent roles</span></div><div><b>${waves}</b><span>waves of work</span></div></div>`;
 const ck=b.checks||{};const all=checks.every((_,i)=>ck[i]);const rec=s.mf40Approval;
 if(s.planApproved)return `<section class="mf40-plan"><div class="mf40-planhead"><div><div class="mf40-eyebrow">Step 2 · Approve</div><h2>Plan v${esc(s.planRevision)} is approved</h2><p>Approved by ${esc(rec?.by||'a reviewer')}${rec?.at?' on '+esc(rec.at):''}. Agents may run any task whose dependencies are built and reviewed. Revising the plan stops new runs until it is approved again.</p></div><div class="mf40-actions" style="margin:0"><button class="btn" data-mf20="reopen">Revise plan</button><button class="btn primary" data-mf40="view" data-id="run">Go to Run →</button></div></div>${tiles}<h3 class="mf40-h3">Checked before approval</h3>${checks.map(([a,d])=>`<div class="mf40-check on static"><span class="box">✓</span><span><b>${esc(a)}</b><small>${esc(d)}</small></span></div>`).join('')}</section>`;
 return `<section class="mf40-plan"><div class="mf40-planhead"><div><div class="mf40-eyebrow">Step 2 · Approve</div><h2>Approve implementation plan v${esc(s.planRevision)}</h2><p>This is a human gate: no agent starts until a person approves the plan. Check each item, then approve.</p></div></div>${tiles}<h3 class="mf40-h3">Before you approve</h3>${checks.map(([a,d],i)=>`<button type="button" class="mf40-check ${ck[i]?'on':''}" role="checkbox" aria-checked="${!!ck[i]}" data-mf40="check" data-id="${i}"><span class="box">${ck[i]?'✓':''}</span><span><b>${esc(a)}</b><small>${esc(d)}</small></span></button>`).join('')}<div class="mf40-actions"><button class="btn primary" data-mf40="approveplan" ${all&&arch?'':'disabled'}>Approve plan v${esc(s.planRevision)}</button><button class="btn" data-mf40="view" data-id="plan">Back to plan</button>${all?'':`<span class="v8-meta">${checks.length-checks.filter((_,i)=>ck[i]).length} item${checks.length-checks.filter((_,i)=>ck[i]).length===1?'':'s'} left to check</span>`}</div></section>`}

function mf40Hash(str){let h=2166136261;for(const c of String(str)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function mf40Sha(str,len=7){return (mf40Hash(str).toString(16)+mf40Hash(str+'#').toString(16)+mf40Hash(str+'!').toString(16)).padStart(24,'0').slice(0,len)}
function mf40Slug(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,26)}

function mf40PR(t,v){const i=v.tasks.indexOf(t),st=mf40State(t,v),h=mf40Hash(t.id);const map={done:['Merged','done'],review:['Awaiting review','review'],validation:['Checks running','running'],sandbox:['Draft · agent committing','running'],failed:['Checks failing','failed']};const m=map[st];if(!m)return null;
 return {n:101+i,branch:`task/${t.id.toLowerCase()}-${mf40Slug(t.title)}`,add:40+h%380,del:h%60,files:2+h%9,label:m[0],cls:m[1],checks:st==='done'||st==='review'?'6/6':st==='validation'?'2/6':st==='failed'?'4/6':'0/6',sha:mf40Sha(t.id+'merge'),st}}

 return [

 {id:'build',stage:1,needs:['merge'],dur:161,name:'Build',desc:py?'Install dependencies; build backend (Python 3.12, uv) and frontend (Node 20, Vite)':'Compile and assemble with Gradle (Java 21, Spring Boot 3)',sum:py?'Backend and frontend built · frontend bundle 1.4 MB':'bootJar built · 41 MB',log:py?['uv sync --frozen → 84 packages installed','python -m compileall backend/app → ok','npm ci → 612 packages','npm run build → frontend/dist (1.4 MB, 38 chunks)']:['./gradlew clean assemble','BUILD SUCCESSFUL in 1m 52s','bootJar → payment-service-0.1.0.jar']},
 {id:'static',stage:1,needs:['merge'],dur:65,name:'Static analysis',desc:py?'Lint and type-check: ruff, mypy --strict, eslint, tsc':'Checkstyle, SpotBugs, PMD',sum:'0 errors · 0 warnings above threshold',log:py?['ruff check . → All checks passed','mypy backend/app → no issues in 96 files','eslint frontend/src → 0 problems','tsc --noEmit → 0 errors']:['checkstyleMain → 0 violations','spotbugsMain → 0 bugs','pmdMain → 0 violations']},

function mf40DepList(v,ids,key,b,label,emptyText){const pkCount=new Set(ids.map(id=>id.split('-')[0]));if(!ids.length)return `<h3>${label}</h3><p class="v8-meta">${emptyText}</p>`;

function mf40Panel(p,v,s,b,pk){if(!b.panel)return '';const close=`<button class="mf40-x" data-mf40="close" aria-label="Close panel">×</button>`;const list=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;

 const t=(v.tasks||[]).find(x=>x.id===b.sel);if(!t)return '';const st=mf40State(t,v),k=mf40PkgOf(pk,t.id),tab=b.tab||'summary';

 const acs=v8AllAC(v).filter(a=>(t.acIds||[]).includes(a.id));const dependents=v.tasks.filter(x=>(x.dependsOn||[]).includes(t.id)).map(x=>x.id);
 const lockMsg=!mf40ArchOk(v)?'Approve the architecture, then the plan, to run this task.':'Approve the plan to run this task.';
 let actions='';

 if(st==='waiting')actions=`<span class="v8-meta">Starts when ${mf40Blockers(t,v).length} earlier task${mf40Blockers(t,v).length>1?'s are':' is'} built and reviewed.</span>`;
 if(st==='ready')actions=`<button class="btn primary" data-mf40="runone" data-id="${esc(t.id)}">Run this task</button>`;

 if(st==='review')actions=`<button class="btn primary" data-mf40="approve" data-id="${esc(t.id)}">Approve &amp; merge PR #${101+v.tasks.indexOf(t)}</button><button class="btn" data-mf40="changes" data-id="${esc(t.id)}">Request changes</button>`;

 let body='';
 if(tab==='summary'){const last=(v.runs||[]).filter(r=>r.taskId===t.id).at(-1);const depPk=new Set(dependents.map(id=>mf40PkgOf(pk,id).id)).size;
  body=`<dl class="mf40-kv"><dt>Status</dt><dd><span class="mf40-st ${mf40StClass(st)}">${esc(mf40Label[st])}</span></dd><dt>Work package</dt><dd><span class="mf40-sw" style="background:${k.color};margin-right:6px"></span>${esc(k.id)} · ${esc(k.name)}</dd><dt>Agent role</dt><dd>${esc(t.agent)}</dd><dt>Requirements</dt><dd>${esc((t.reqIds||[]).join(', ')||'—')}</dd>${(()=>{const r=mf40PR(t,v);return r?`<dt>Pull request</dt><dd>#${r.n} · <code>${esc(r.branch)}</code><br><span class="v8-meta">+${r.add} −${r.del} · checks ${r.checks} · ${esc(r.label)}${r.cls==='done'?' as '+r.sha:''}</span></dd>`:''})()}${last?`<dt>Last attempt</dt><dd>${esc(last.id)} · ${esc(last.status)}</dd>`:''}</dl>

  ${mf40DepList(v,t.dependsOn||[],'depsAllUp',b,'Depends on','Nothing. Can start first.')}
  ${dependents.length>5?`<h3>Unblocks · ${dependents.length}</h3><p class="mf40-deps-sum">Unblocks ${dependents.length} tasks in ${depPk} work package${depPk>1?'s':''}.</p>`+mf40DepList(v,dependents,'depsAll',b,'Next up','').replace(/^<h3>[^<]*<\/h3>/,''):mf40DepList(v,dependents,'depsAll',b,'Unblocks','No later tasks depend on this.')}`}
 else if(tab==='attempts'){const rs=(v.runs||[]).filter(r=>r.taskId===t.id).reverse();body=rs.length?rs.map(r=>`<div class="mf40-run"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(r.id)}</b><span class="mf40-st ${r.status==='Failed'?'failed':'done'}">${esc(r.status)}</span></div><div class="v8-meta">${esc(r.agent)} · ${esc(r.date)}</div><ol>${(r.logs||[]).map(l=>`<li>${esc(l)}</li>`).join('')}</ol></div>`).join('')+'<p class="v8-meta">Each attempt runs in a fresh isolated sandbox. Logs are simulated in this prototype.</p>':'<p class="v8-meta">No attempts yet. Each run happens in a fresh isolated sandbox and is recorded here.</p>'}

 else{body=`${k.objective?`<h3>Package objective</h3><p>${esc(k.objective)}</p>`:''}${k.steps.length?`<h3>Implementation steps</h3><ol>${k.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}${k.contracts.length?`<h3>Interfaces and contracts</h3>${list(k.contracts)}`:''}${k.tests.length?`<h3>Required tests</h3>${list(k.tests)}`:''}${k.risks.length?`<h3>Failure and safety requirements</h3>${list(k.risks)}`:''}${k.done?`<h3>Definition of done</h3><p>${esc(k.done)}</p>`:''}${p.id==='mf-001'&&typeof mf25TaskMarkup==='function'?`<h3>Agent instructions</h3><div class="mf40-legacy">${mf25TaskMarkup(t,v,s)}</div>`:''}${!k.objective&&!k.steps.length?'<p class="v8-meta">No detailed specification for this task yet.</p>':''}`}
 return `<aside class="mf40-panel" role="dialog" aria-label="${esc(t.id)} details"><div class="mf40-ph">${close}<span class="mf40-pkg"><span class="mf40-sw" style="background:${k.color}"></span>${esc(t.id)} · ${esc(k.name)}</span><h2>${esc(t.title)}</h2><div class="mf40-tabs" role="tablist">${tabs.map(([id,n])=>`<button role="tab" aria-selected="${tab===id}" class="${tab===id?'active':''}" data-mf40="tab" data-id="${id}">${n}</button>`).join('')}</div></div><div class="mf40-pb">${body}<div class="mf40-actions">${actions}</div></div></aside>`}
function mf40Rerender(){if(activePage(route())==='Build')render()}
function mf40Dispatch(p,list,failFirst){mf20State(v8Init(p)).mf40Int=null;list.forEach(t=>{mf40Fly[t.id]='sandbox';t.mf40Reviewed=false});const first=list[0];notify(`${list.length} task${list.length>1?'s':''} sent to isolated sandboxes${first?' · '+first.id+' running':''}`);v8Save();mf40Rerender();
 setTimeout(()=>{list.forEach((t,i)=>{if(failFirst&&i===0){delete mf40Fly[t.id];v8Run(p,t,true)}else mf40Fly[t.id]='validation'});v8Save();mf40Rerender();if(failFirst)notify(`${first.id} failed in its sandbox. Retry is available.`)},1200);
 setTimeout(()=>{const fin=list.filter((t,i)=>!(failFirst&&i===0));fin.forEach(t=>{delete mf40Fly[t.id];v8Run(p,t,false)});v8Save();mf40Rerender();if(fin.length)notify(`${fin.length} task output${fin.length>1?'s':''} passed validation and await your review`)},2500)}

document.addEventListener('click',function(e){const b=e.target.closest('[data-mf40]');if(!b)return;const p=project();if(!p)return;const v=v8Init(p),s=mf20State(v),m=mf40S(v),a=b.dataset.mf40,id=b.dataset.id||'';e.preventDefault();e.stopImmediatePropagation();
 if(a==='select'){if(b.dataset.view)m.view=b.dataset.view;if(m.sel===id&&m.panel==='task'&&!b.dataset.tab&&!b.dataset.view){m.sel=null;m.panel=null}else{m.sel=id;m.panel='task';m.tab=b.dataset.tab||'summary';m.depsAll=false;m.depsAllUp=false}}
 else if(a==='view'){m.view=id;if(id!=='run'&&id!=='plan'){m.panel=null;m.sel=null}}

 else if(a==='approveall'){const rs=v.tasks.filter(t=>mf40State(t,v)==='review');rs.forEach(t=>{t.mf40Reviewed=true});if(rs.length){addEvent(p,`${rs.length} task outputs approved by reviewer`);notify(`${rs.length} outputs approved`)}m.panel=null;m.sel=null}
 else if(a==='job'){m.openJob=b.getAttribute('aria-expanded')==='true'?null:id}

 else if(a==='approve'){const t=v.tasks.find(x=>x.id===id);if(t){t.mf40Reviewed=true;addEvent(p,`${t.id} output approved by reviewer`);notify(`${t.id} approved. Dependent tasks can now run.`);const nxt=v.tasks.find(x=>x.status==='Completed'&&!x.mf40Reviewed);if(nxt){m.sel=nxt.id;m.tab='summary'}else{m.sel=null;m.panel=null}}}
 else if(a==='changes'){const t=v.tasks.find(x=>x.id===id);if(t){t.status='Planned';t.mf40Reviewed=false;s.mf40Int=null;(t.notes=t.notes||[]).push('Changes requested by reviewer');addEvent(p,`${t.id} returned to backlog: changes requested`);notify(`${t.id} returned to the backlog`);m.sel=null;m.panel=null}}
