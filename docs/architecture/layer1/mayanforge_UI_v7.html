</style>
<script>
const mf41PriorVerification=verification;
const mf41Fly={};// projectId -> {k} while tests run (not persisted)
function mf41S(v){if(!v.mf41)v.mf41={view:null,planApproved:false,run:null,signoff:null,openSuite:null};return v.mf41}
// the frozen release candidate produced by Build → Integrate
function mf41Candidate(p,v){const s=mf20State(v),int=s.mf40Int;if(!int||int.status!=='passed'||!(v.tasks||[]).length||!v.tasks.every(mf40Done))return null;const rc=int.n,repo=mf40Repo(p),py=p.id==='mf-001';return {rc,tag:`v0.1.0-rc${rc}`,sha:mf40Sha(p.id+'rc'+rc),at:int.at,images:(py?['api','web']:['payment-service']).map(n=>`ghcr.io/${repo}/${n}:v0.1.0-rc${rc}`)}}
function mf41Cases(p,v){const py=p.id==='mf-001';
 if(py&&typeof mf27Cases!=='undefined'){const c=mf27Cases.map(x=>({id:x[0],title:x[1],req:x[2],type:x[3],how:x[4],expect:x[5]}));const sec=(typeof mf27Safety!=='undefined'?mf27Safety:[]).map(x=>({id:x[0],title:x[1],req:x[3],type:'Security',how:'Attack or fault scenario',expect:x[2]}));
  const e2e=[['E2E-01','Ask a question and open its citations','REQ-003'],['E2E-02','Unsupported question is declined','REQ-005'],['E2E-03','Request is classified and routed','REQ-006'],['E2E-04','Ambiguous request lands in review queue','REQ-007'],['E2E-05','CRM draft → approve → execute once','REQ-011'],['E2E-06','Error and empty states are clear','REQ-014']].map(([id,t,r])=>({id,title:t,req:r,type:'E2E',how:'Playwright user journey against the candidate',expect:'Journey completes with the expected screens and data'}));
  return c.concat(e2e,sec)}
 const ac=v8AllAC(v);return ac.map((a,i)=>({id:'TC-'+String(i+1).padStart(3,'0'),title:a.text,req:a.reqId,type:'Functional',how:'API test against the candidate',expect:`${a.id} holds`})).concat([{id:'E2E-01',title:'Main journey end to end',req:(v.requirements[0]||{}).id,type:'E2E',how:'Scripted journey',expect:'Completes'},{id:'SEC-01',title:'Unauthenticated access is rejected',req:'NFR-001',type:'Security',how:'Attack scenario',expect:'401 and audit entry'},{id:'SEC-02',title:'Duplicate event cannot double-charge',req:'REQ-001',type:'Security',how:'Replay attack',expect:'Exactly one effect'},{id:'REL-01',title:'Recovers from broker outage',req:'NFR-001',type:'Reliability',how:'Fault injection',expect:'No data loss'}])}
function mf41Suites(p){const py=p.id==='mf-001';return [
 {id:'functional',types:['Functional'],name:'Functional & API tests',runner:py?'pytest + httpx · mock CRM sandbox':'JUnit + REST Assured',dur:312},
 {id:'e2e',types:['E2E'],name:'End-to-end journeys',runner:'Playwright · Chromium',dur:268},
 ...(py?[{id:'ai',types:['AI'],name:'AI evaluation',runner:'Evaluation harness · pinned model, prompts and datasets',dur:540}]:[]),
 {id:'security',types:['Security'],name:py?'Security & CRM safety':'Security',runner:'Attack scenarios · OWASP ZAP baseline',dur:356},
 {id:'reliability',types:['Reliability'],name:'Reliability & performance',runner:'Fault injection · k6 load test',dur:420}]}
function mf41FailIds(p){return p.id==='mf-001'?['TC-012','TC-004']:['TC-001','SEC-02']}
function mf41CaseResult(c,run,p){if(!run)return null;const f=run.fail&&mf41FailIds(p).includes(c.id);return f?'failed':'passed'}
function mf41Gates(p,v,cases,run){const py=p.id==='mf-001';const reqs=(v.requirements||[]).map(r=>r.id);const covered=reqs.filter(r=>cases.some(c=>c.req===r)).length;const f=!!run?.fail;
 const fe=cases.filter(c=>c.type==='Functional'||c.type==='E2E');const feFail=run?fe.filter(c=>mf41CaseResult(c,run,p)==='failed').length:0;
 const g=[['Requirement coverage',`${covered} of ${reqs.length} requirements have tests`,`${reqs.length?Math.round(covered/reqs.length*100):0}%`,'100%',covered===reqs.length],
  ['Functional and end-to-end tests','every test passes',`${fe.length-feFail}/${fe.length} passed`,'all pass',!feFail]];
 if(py)g.push(['RAG answer faithfulness','answers supported by retrieved evidence','0.93','≥ 0.90',true],['Citation correctness','citations point to the right source location',f?'0.92':'0.96','≥ 0.95',!f],['Correct abstention','unsupported questions are declined','0.91','≥ 0.90',true],['Retrieval recall@5','expected passage in top 5','0.88','≥ 0.85',true],['Classification macro-F1','balanced quality across categories','0.87','≥ 0.85',true],['Ambiguous requests sent to review','no silent categorisation','100%','100%',true],['Unapproved or duplicate CRM writes','human approval and idempotency hold',f?'1 duplicate':'0','0',!f]);
 else g.push(['Duplicate payment effects','idempotency holds under replay',f?'1':'0','0',!f],['Audit completeness','every decision has evidence','100%','100%',true]);
 g.push(['Security findings','critical / high','0 / 0','0 / 0',true],['p95 response time',py?'question answering':'event processing',py?'3.4 s':'180 ms',py?'≤ 5 s':'≤ 300 ms',true],['Secrets or personal data in logs','redaction holds','0','0',true]);
 return g.map(([name,what,measured,threshold,ok])=>({name,what,measured,threshold,ok:run?ok:null}))}
function mf41Defects(p,v){const by=(id,i)=>v.tasks.find(t=>t.id===id)||v.tasks[Math.min(i,v.tasks.length-1)];
 return p.id==='mf-001'?[{id:'DEF-001',sev:'Critical',title:'Duplicate CRM note when a write is retried after a timeout',test:'TC-012',req:'REQ-012',gate:'Unapproved or duplicate CRM writes',task:by('TASK-025',24),steps:['Approve a CRM note draft','Force the CRM sandbox to time out after receiving the write','Let the retry policy run','Observe two notes created in the CRM sandbox']},{id:'DEF-002',sev:'Major',title:'DOCX answers cite the document but not the section',test:'TC-004',req:'REQ-004',gate:'Citation correctness',task:by('TASK-008',7),steps:['Upload a DOCX with headed sections','Ask a question answered in section 3','Open the citation','Citation has no section location (citation correctness drops to 0.92)']}]
 :[{id:'DEF-001',sev:'Critical',title:'Replayed event creates a second effect',test:'SEC-02',req:'REQ-001',gate:'Duplicate payment effects',task:by('',1),steps:['Send a payment event','Replay the same event','Two rows are written']},{id:'DEF-002',sev:'Major',title:'Acceptance criterion fails under load',test:'TC-001',req:'REQ-001',gate:'Functional and end-to-end tests',task:by('',2),steps:['Run TC-001 with 50 concurrent events','One assertion fails']}]}
function mf41Steps(x,cand,run,verdict,running){const g=[['plan','Plan',x.planApproved,x.planApproved?'approved':'needs approval'],['execute','Execute',!!run,running?'tests running':run?`${run.passed}/${run.total} tests passed`:cand?`ready · ${cand.tag}`:'waiting for candidate'],['evaluate','Evaluate',verdict==='passed',verdict==='passed'?'all gates passed':verdict==='failed'?'gates failed':'after tests'],['signoff','Sign-off',!!x.signoff,x.signoff?'signed off':'needs a person']];const cur=g.findIndex(s=>!s[2]);const view=x._view;
 return `<nav class="mf40-steps" aria-label="Verification steps">${g.map(([id,n,ok,meta],i)=>`${i?'<span class="mf40-step-line" aria-hidden="true"></span>':''}<button type="button" class="mf40-step ${ok?'done':''} ${i===cur?'current':''} ${view===id?'active':''}" data-mf41="view" data-id="${id}" aria-current="${view===id?'step':'false'}"><span class="num">${ok?'✓':i+1}</span><span class="lbl">${n}<small>${esc(meta)}</small></span></button>`).join('')}</nav>`}
function mf41Verify(p){const v=v8Init(p),x=mf41S(v),b=mf40S(v);
 if(x.classic)return `<div class="mf40-note" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px"><span>You are viewing the detailed technical layout.</span><button class="btn" data-mf41="classic">← Back to Verification steps</button></div>${mf41PriorVerification(p)}`;
 const cand=mf41Candidate(p,v),cases=mf41Cases(p,v),suites=mf41Suites(p),fly=mf41Fly[p.id];const running=!!fly;
 let run=x.run&&cand&&x.run.rc===cand.rc&&!running?x.run:null;
 if(run){const total=cases.length,failed=cases.filter(c=>mf41CaseResult(c,run,p)==='failed').length;run={...run,total,passed:total-failed,failed}}
 const gates=mf41Gates(p,v,cases,run);const verdict=run?(gates.every(g=>g.ok)?'passed':'failed'):null;
 const phase=!x.planApproved?'plan':!run?'execute':verdict!=='passed'?'evaluate':'signoff';x._view=x.view||phase;const view=x._view;
 // header
 let primary='';
 if(!x.planApproved)primary=view==='plan'?'':`<button class="btn primary" data-mf41="view" data-id="plan">Review &amp; approve test plan</button>`;
 else if(!cand)primary=`<button class="btn primary" data-go="${projpath('Build')}">Go to Build → Integrate</button>`;
 else if(running)primary='<button class="btn primary" disabled>Tests running…</button>';
 else if(!run)primary=`<button class="btn primary" data-mf41="run">Run verification on ${esc(cand.tag)}</button>`;
 else if(verdict==='failed')primary=`<button class="btn primary" data-mf41="view" data-id="evaluate">Review ${mf41Defects(p,v).length} defects</button>`;
 else if(!x.signoff)primary=`<button class="btn primary" data-mf41="view" data-id="signoff">Review &amp; sign off</button>`;
 else primary=`<button class="btn primary" data-go="${projpath('Release')}">Continue to Release →</button>`;
 const dot=verdict==='failed'?'bad':running?'run':x.signoff?'ok':'warn';
 const headline=!x.planApproved?'Test plan awaiting approval':!cand?'Waiting for a release candidate':running?'Tests running':!run?`Ready to verify ${cand.tag}`:verdict==='failed'?'Verification failed':!x.signoff?'All gates passed · awaiting sign-off':'Verified and signed off';
 const bits=[`<span><span class="mf40-dot ${dot}"></span><b>${esc(headline)}</b></span>`];if(cand)bits.push(`<span>Candidate ${esc(cand.tag)}</span>`);if(run)bits.push(`<span>${run.passed} of ${run.total} tests passed</span>`);
 const head=`<div class="crumb">Workspace / ${esc(p.name)} / Verification</div><div class="mf40-head"><div><h1>Verification</h1><div class="mf40-status">${bits.join('')}</div></div><div class="mf40-headactions">${primary}</div></div>`;
 const attn=[];
 if(x.planApproved&&!cand)attn.push(['','No release candidate yet.','Verification tests an exact, frozen build produced by Build → Integrate.',`<button class="btn" data-go="${projpath('Build')}">Open Build</button>`]);
 if(verdict==='failed'&&view!=='evaluate')attn.push(['bad','Verification failed.',`${mf41Defects(p,v).length} defects found. The candidate cannot be released.`,'<button class="btn" data-mf41="view" data-id="evaluate">See defects</button>']);
 if(verdict==='passed'&&!x.signoff&&view!=='signoff')attn.push(['','All quality gates passed.','A person must sign off the verification report before Release.','<button class="btn" data-mf41="view" data-id="signoff">Sign off</button>']);
 const banner=attn.length?`<div class="mf40-attn" role="region" aria-label="Needs your attention">${attn.map(([c,a,b2,btn])=>`<div class="mf40-attn-row ${c}"><span><strong>${a}</strong> ${b2}</span>${btn}</div>`).join('')}</div>`:'';
 const body=view==='plan'?mf41PlanView(p,v,x,cases,suites,gates):view==='execute'?mf41ExecView(p,v,x,cand,cases,suites,run,fly):view==='evaluate'?mf41EvalView(p,v,x,cand,cases,gates,run,verdict,running):mf41SignView(p,v,x,cand,cases,gates,run,verdict);
 return `${head}${steps(p)}${banner}${mf41Steps(x,cand,run,verdict,running)}${body}<div class="mf40-foot"><span></span><button class="btn" data-mf41="classic" title="Previous layout with every verification section">Detailed technical view</button></div>`}
function mf41PlanView(p,v,x,cases,suites,gates){const reqs=v.requirements||[];const gaps=reqs.filter(r=>!cases.some(c=>c.req===r.id));
 const rows=reqs.map(r=>{const cs=cases.filter(c=>c.req===r.id);return `<tr><td>${esc(r.id)}</td><td>${esc(r.title)}</td><td>${cs.length?cs.map(c=>`<span class="mf41-chip">${esc(c.id)}</span>`).join(''):'<span class="mf41-chip gap">No test · gap</span>'}</td><td>${esc([...new Set(cs.map(c=>c.type))].join(', '))}</td></tr>`}).join('');
 const actions=x.planApproved?`<span class="badge good">Approved</span><button class="btn" data-mf41="revise">Revise plan</button>`:`<button class="btn primary" data-mf41="approveplan">Approve test plan</button>`;
 return `<section class="mf40-plan"><div class="mf40-planhead"><div><div class="mf40-eyebrow">Step 1 · Plan</div><h2>Verification plan v1</h2><p>Generated by the verification planning agent from the approved requirements. Every requirement maps to tests, and every AI, safety and performance requirement has a measurable threshold. Approving the plan also approves these thresholds.</p></div><div class="mf40-actions" style="margin:0">${actions}</div></div>
 <div class="mf40-tiles"><div><b>${reqs.length}</b><span>requirements</span></div><div><b>${cases.length}</b><span>test cases</span></div><div><b>${suites.length}</b><span>test suites</span></div><div><b>${gates.length}</b><span>quality gates</span></div></div>
 ${gaps.length?`<div class="mf40-attn" style="margin-top:12px"><div class="mf40-attn-row"><span><strong>${gaps.length} requirement${gaps.length>1?'s have':' has'} no test.</strong> Add tests or record an exception before approving.</span></div></div>`:''}
 <div class="mf40-sec"><div class="mf40-sec-h"><h3>Coverage: requirement → tests</h3><span class="v8-meta">${reqs.length-gaps.length} of ${reqs.length} covered</span></div><table class="mf41-cov"><thead><tr><th>Req</th><th>Requirement</th><th>Tests</th><th>Type</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="mf40-sec"><div class="mf40-sec-h"><h3>Test suites</h3><span class="v8-meta">Run in parallel against the release candidate</span></div><div class="mf41-suites">${suites.map(s=>{const n=cases.filter(c=>s.types.includes(c.type)).length;return `<div class="mf40-jcard queued" style="cursor:default"><span class="dot"></span><span class="nm"><b>${esc(s.name)}</b><small>${n} tests · ${esc(s.runner)}</small></span><span class="t">~${Math.round(s.dur/60)} min</span></div>`}).join('')}</div></div>
 <div class="mf40-sec"><div class="mf40-sec-h"><h3>Quality gates and thresholds</h3><span class="v8-meta">Applied by the independent Evaluation Engine</span></div><table class="mf41-gates"><thead><tr><th>Gate</th><th>What it checks</th><th>Threshold</th></tr></thead><tbody>${gates.map(g=>`<tr><td><b>${esc(g.name)}</b></td><td>${esc(g.what)}</td><td class="m">${esc(g.threshold)}</td></tr>`).join('')}</tbody></table></div>
 <p class="v8-meta" style="margin-top:14px">Thresholds and results in this prototype are illustrative.</p></section>`}
function mf41SuiteState(s,i,suites,run,fly,cases,p){const rank=[...suites].sort((a,b)=>a.dur-b.dur).indexOf(s);if(fly){return rank<fly.k?'done':'run'}if(!run)return 'queued';return cases.filter(c=>s.types.includes(c.type)).some(c=>mf41CaseResult(c,run,p)==='failed')?'bad':'done'}
function mf41ExecView(p,v,x,cand,cases,suites,run,fly){
 if(!cand)return `<section class="mf40-plan"><div class="mf40-planhead"><div><div class="mf40-eyebrow">Step 2 · Execute</div><h2>Waiting for a release candidate</h2><p>Verification always tests an exact, frozen build: a tagged commit with its images, produced by Build → Integrate. Nothing runs against work in progress.</p></div><div class="mf40-actions" style="margin:0"><button class="btn primary" data-go="${projpath('Build')}">Open Build</button><button class="btn" data-mf41="democand" title="Demo only: finishes Build and creates a release candidate instantly">Prepare demo candidate</button></div></div></section>`;
 const py=p.id==='mf-001';
 const env=`<div class="mf40-cand" style="border-color:#dbe5f3;background:#f8fbff"><div style="flex:1"><div class="mf40-eyebrow">Under test</div><b>${esc(cand.tag)}</b><dl class="mf40-kv" style="margin-top:8px;grid-template-columns:130px 1fr"><dt>Commit</dt><dd><code class="mf40-sha">${esc(cand.sha)}</code></dd><dt>Images</dt><dd>${cand.images.map(i=>`<code>${esc(i)}</code>`).join('<br>')}</dd><dt>Environment</dt><dd>Isolated namespace <code>verify-rc${cand.rc}</code> · fresh database · no access to Build agents</dd>${py?`<dt>Test data</dt><dd>Synthetic fixtures v1 · RAG set 120 questions · classification set 300 labelled requests · mock CRM sandbox</dd><dt>AI settings</dt><dd>Pinned model, prompt and retrieval settings · config <code class="mf40-sha">${mf40Sha('cfg'+cand.rc)}</code></dd>`:''}</dl></div><span class="mf40-st done">Frozen</span></div>`;
 let actions;if(!x.planApproved)actions=`<button class="btn primary" data-mf41="view" data-id="plan">Approve the test plan first</button>`;else if(fly)actions='<button class="btn primary" disabled>Tests running…</button>';else if(!run)actions=`<button class="btn primary" data-mf41="run">Run verification</button><button class="btn" data-mf41="runfail" title="Demo: two tests fail">Simulate failure</button>`;else actions=`<button class="btn" data-mf41="run">Re-run</button><button class="btn" data-mf41="runfail">Re-run with failure (demo)</button><button class="btn primary" data-mf41="view" data-id="evaluate">See evaluation →</button>`;
 const title=fly?(fly.k>suites.length?'Evaluation Engine is applying the quality gates…':`Running ${suites.length} suites in parallel`):run?`${run.passed} of ${run.total} tests passed`:`Run ${cases.length} tests against ${cand.tag}`;
 const cards=suites.map((s,i)=>{const st=mf41SuiteState(s,i,suites,run,fly,cases,p);const cs=cases.filter(c=>s.types.includes(c.type));const nf=run?cs.filter(c=>mf41CaseResult(c,run,p)==='failed').length:0;const txt=st==='done'||st==='bad'?`${cs.length-nf}/${cs.length} passed${nf?` · ${nf} failed`:''}`:`${cs.length} tests · ${s.runner}`;const right={done:mf40Fmt(s.dur),bad:mf40Fmt(s.dur),run:'running…',queued:'queued'}[st];
  return `<button type="button" class="mf40-jcard ${st} ${x.openSuite===s.id?'sel':''}" data-mf41="suite" data-id="${s.id}" aria-expanded="${x.openSuite===s.id}"><span class="dot">${st==='done'?'✓':st==='bad'?'✕':''}</span><span class="nm"><b>${esc(s.name)}</b><small>${esc(txt)}</small></span><span class="t">${right}</span></button>`}).join('');
 const os=suites.find(s=>s.id===x.openSuite);const box=os?`<div class="mf41-casebox"><div class="h"><span>${esc(os.name)} · ${esc(os.runner)}</span><span class="v8-meta">${cases.filter(c=>os.types.includes(c.type)).length} tests</span></div><table class="mf41-cases">${cases.filter(c=>os.types.includes(c.type)).map(c=>{const r=fly?null:mf41CaseResult(c,run,p);return `<tr class="${r==='failed'?'bad':''}"><td>${esc(c.id)}</td><td><b>${esc(c.title)}</b><br><span class="v8-meta">${esc(c.how)} → ${esc(c.expect)}</span></td><td>${esc(c.req)}</td><td><span class="mf40-st ${r==='passed'?'done':r==='failed'?'failed':''}">${r==='passed'?'Passed':r==='failed'?'Failed':'Not run'}</span></td></tr>`}).join('')}</table></div>`:'';
 return `<section class="mf40-plan"><div class="mf40-planhead"><div><div class="mf40-eyebrow">Step 2 · Execute</div><h2>${esc(title)}</h2><p>Independent test workers run every suite in parallel in an isolated environment. They see the candidate and the approved test plan, not the code agents' own claims.</p></div><div class="mf40-actions" style="margin:0">${actions}</div></div>${env}<div class="mf40-sec"><div class="mf40-sec-h"><h3>Test suites</h3><span class="v8-meta">Click a suite to see its tests</span></div><div class="mf41-suites">${cards}</div>${box}</div><p class="v8-meta" style="margin-top:14px">Test runs and results in this prototype are simulated.</p></section>`}
function mf41EvalView(p,v,x,cand,cases,gates,run,verdict,running){
 if(!run)return `<section class="mf40-plan"><div class="mf40-planhead"><div><div class="mf40-eyebrow">Step 3 · Evaluate</div><h2>${running?'Tests are running':'Evaluation runs after the tests'}</h2><p>The independent Evaluation Engine compares the test evidence with the approved thresholds and decides pass or fail for each gate and each requirement. Agents cannot change its result.</p></div><div class="mf40-actions" style="margin:0"><button class="btn primary" data-mf41="view" data-id="execute">Go to Execute →</button></div></div><table class="mf41-gates"><thead><tr><th>Gate</th><th>Threshold</th><th>Result</th></tr></thead><tbody>${gates.map(g=>`<tr><td><b>${esc(g.name)}</b><br><span class="v8-meta">${esc(g.what)}</span></td><td class="m">${esc(g.threshold)}</td><td><span class="mf40-st">Not evaluated</span></td></tr>`).join('')}</tbody></table></section>`;
